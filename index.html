<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question 💌</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            color: #4a2935;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(190, 100, 130, 0.2);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            margin: 10px 0 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #76515e;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            border: none;
            padding: 16px 25px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #ff7fa3;
            color: white;
            transition: all 0.25s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff5f8b;
            box-shadow: 0 8px 20px rgba(255, 95, 139, 0.3);
        }

        .heart {
            position: absolute;
            font-size: 25px;
            animation: float 5s infinite ease-in-out;
            opacity: 0.6;
        }

        .heart:nth-child(1) {
            left: 10%;
            top: 20%;
        }

        .heart:nth-child(2) {
            right: 12%;
            top: 15%;
            animation-delay: 1s;
        }

        .heart:nth-child(3) {
            left: 18%;
            bottom: 15%;
            animation-delay: 2s;
        }

        .heart:nth-child(4) {
            right: 18%;
            bottom: 20%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>
