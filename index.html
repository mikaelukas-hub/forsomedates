```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5c8, #fff3a6);
            color: #29402b;
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 520px;
            padding: 50px 30px;
            text-align: center;
            background: #fffef2;
            border: 4px solid #8fbc5a;
            border-radius: 30px;
            box-shadow: 0 15px 0 #6d9845;
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.2;
            margin: 10px 0 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #5d704d;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .button {
            display: block;
            text-decoration: none;
            padding: 17px 25px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: bold;
            background: #78a94d;
            color: white;
            border: 3px solid #527d35;
            box-shadow: 0 5px 0 #45682d;
            transition: all 0.15s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            background: #8fbd5c;
        }

        .button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #45682d;
        }

        .button:nth-child(2) {
            background: #f3c84b;
            color: #4b3b10;
            border-color: #c79d22;
            box-shadow: 0 5px 0 #a17c16;
        }

        .button:nth-child(2):hover {
            background: #ffd866;
        }

        .decoration {
            position: absolute;
            font-size: 35px;
            opacity: 0.8;
            animation: float 4s infinite ease-in-out;
        }

        .decoration:nth-child(1) {
            left: 8%;
            top: 15%;
        }

        .decoration:nth-child(2) {
            right: 10%;
            top: 18%;
            animation-delay: 1s;
        }

        .decoration:nth-child(3) {
            left: 12%;
            bottom: 15%;
            animation-delay: 2s;
        }

        .decoration:nth-child(4) {
            right: 12%;
            bottom: 18%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 27px;
            }

            .card {
                padding: 40px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="decoration">🌱</div>
    <div class="decoration">☀️</div>
    <div class="decoration">🍀</div>
    <div class="decoration">⭐</div>

    <div class="card">

        <div class="emoji">🗺️</div>

        <h1>Would you like to go somewhere together?</h1>

        <p>I have a little something planned for us...</p>

        <div class="buttons">

            <a href="rules.html" class="button">
                YES, ABSOLUTELY 👍
            </a>

            <a href="rules.html" class="button">
                YES, PLEASE 🥺
            </a>

        </div>

    </div>

</body>
</html>
```
