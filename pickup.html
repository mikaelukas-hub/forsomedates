<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Last Thing</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e8f5c8,
                #fff3a6
            );

            color: #29402b;

            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 540px;

            background: #fffef2;

            border: 4px solid #8fbc5a;

            border-radius: 30px;

            padding: 45px 30px;

            text-align: center;

            box-shadow: 0 15px 0 #6d9845;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 30px;
            margin: 5px 0 12px;

            color: #36582f;
        }

        .subtitle {
            font-size: 17px;

            line-height: 1.5;

            color: #66765a;

            margin-bottom: 30px;
        }

        .question {
            font-size: 20px;

            font-weight: bold;

            color: #36582f;

            margin-bottom: 22px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice {
            display: block;

            width: 100%;

            padding: 17px 20px;

            border-radius: 18px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            color: white;

            background: #78a94d;

            border: 3px solid #527d35;

            box-shadow: 0 5px 0 #45682d;

            transition: 0.15s ease;

            cursor: pointer;
        }

        .choice:hover {
            background: #8fbd5c;

            transform: translateY(-2px);
        }

        .choice:active {
            transform: translateY(3px);

            box-shadow: 0 2px 0 #45682d;
        }

        .choice.no {
            background: #f0c84b;

            color: #4b3b10;

            border-color: #c59b25;

            box-shadow: 0 5px 0 #a77e18;
        }

        .choice.no:hover {
            background: #f5d263;
        }

        .small-note {
            margin-top: 25px;

            font-size: 13px;

            color: #7a8867;
        }

        .loading {
            display: none;

            margin-top: 20px;

            font-size: 14px;

            color: #527d35;

            font-weight: bold;
        }

        .decoration {
            position: fixed;

            font-size: 32px;

            opacity: 0.7;

            animation: float 4s infinite ease-in-out;
        }

        .decoration:nth-child(1) {
            left: 8%;
            top: 15%;
        }

        .decoration:nth-child(2) {
            right: 8%;
            top: 20%;

            animation-delay: 1s;
        }

        .decoration:nth-child(3) {
            left: 10%;
            bottom: 15%;

            animation-delay: 2s;
        }

        .decoration:nth-child(4) {
            right: 10%;
            bottom: 18%;

            animation-delay: 3s;
        }

        @keyframes float {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(3deg);
            }

        }

    </style>

</head>


<body>


    <!-- Decorations -->

    <div class="decoration">🚗</div>
    <div class="decoration">🗺️</div>
    <div class="decoration">⭐</div>
    <div class="decoration">🌱</div>


    <div class="card">


        <div class="icon">
            🚗
        </div>


        <h1>
            One last thing...
        </h1>


        <p class="subtitle">

            Just sorting out one tiny detail
            before we finalize the plan.

        </p>


        <div class="question">

            Would you like me to pick you up?

        </div>


        <div class="choices">


            <!-- YES -->

            <button
                type="button"
                class="choice"
                onclick="submitFinalChoice('Yes please — I would love that')"
            >

                YES, PLEASE — I WOULD LOVE THAT 👍

            </button>


            <!-- NO -->

            <button
                type="button"
                class="choice no"
                onclick="submitFinalChoice('No, I am fine going alone')"
            >

                NO, I'M FINE GOING ALONE 🚶

            </button>


        </div>


        <div
            class="loading"
            id="loading"
        >

            📋 Finalizing the mission...

        </div>


        <div class="small-note">

            This is the last question.
            <br>
            Promise. 😎

        </div>


    </div>



    <script>

        async function submitFinalChoice(pickupChoice) {


            /*
             * Show loading message
             */

            document.getElementById("loading").style.display = "block";


            /*
             * Disable both buttons
             */

            const buttons =
                document.querySelectorAll(".choice");

            buttons.forEach(function(button) {

                button.disabled = true;

                button.style.opacity = "0.7";

            });


            /*
             * Save pickup choice
             */

            localStorage.setItem(
                "pickupChoice",
                pickupChoice
            );


            /*
             * Get all the information
             * saved from previous pages.
             */

            const weekend1Date =
                localStorage.getItem("weekend1Date") || "Not provided";

            const weekend1Time =
                localStorage.getItem("weekend1Time") || "Not provided";

            const weekend2Date =
                localStorage.getItem("weekend2Date") || "Not provided";

            const weekend2Time =
                localStorage.getItem("weekend2Time") || "Not provided";

            const fridayDate =
                localStorage.getItem("fridayDate") || "Not provided";

            const fridayTime =
                localStorage.getItem("fridayTime") || "Not provided";

            const selectedFood =
                localStorage.getItem("selectedFood") || "Not provided";


            /*
             * Create the information
             * that will be sent to you.
             */

            const formData = new FormData();


            formData.append(
                "Weekend Option 1 - Date",
                weekend1Date
            );

            formData.append(
                "Weekend Option 1 - Time",
                weekend1Time
            );


            formData.append(
                "Weekend Option 2 - Date",
                weekend2Date
            );

            formData.append(
                "Weekend Option 2 - Time",
                weekend2Time
            );


            formData.append(
                "Friday Option - Date",
                fridayDate
            );

            formData.append(
                "Friday Option - Time",
                fridayTime
            );


            formData.append(
                "Food Choice",
                selectedFood
            );


            formData.append(
                "Pickup Choice",
                pickupChoice
            );


            /*
             * Send everything to Formspree.
             */

            try {

                const response = await fetch(
                    "https://formspree.io/f/xoeadwog",
                    {
                        method: "POST",

                        body: formData,

                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );


                /*
                 * If Formspree accepts the submission,
                 * continue to the final page.
                 */

                if (response.ok) {

                    window.location.href = "final.html";

                } else {

                    throw new Error(
                        "Form submission failed"
                    );

                }


            } catch (error) {

                console.error(error);


                document.getElementById("loading").innerHTML =
                    "Hmm... something went wrong 😭<br>" +
                    "Please try your choice again.";

                buttons.forEach(function(button) {

                    button.disabled = false;

                    button.style.opacity = "1";

                });

            }

        }

    </script>


</body>

</html>
